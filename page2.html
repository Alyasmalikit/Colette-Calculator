<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Colette-Calculator | Page 2 — Salaire &amp; Toiture en Croupe</title>
<style>
  :root {
    --bg: #dde5f0;
    --surface: #ffffff;
    --ink: #0f172a;
    --muted: #334155;
    --border: #64748b;
    --border-soft: #cbd5e1;
    --primary: #1a73e8;
    --primary-hover: #1557b0;
    --primary-dark: #103c8c;
    --soft: #dbeafe;
    --warn-bg: #fef9c3;
    --warn-border: #eab308;
    --warn-ink: #713f12;
    --radius: 16px;
    --emboss-card:
      0 12px 26px rgba(15, 23, 42, 0.13),
      0 3px 6px rgba(15, 23, 42, 0.08),
      inset 0 2px 0 rgba(255, 255, 255, 0.96),
      inset 0 -2px 0 rgba(203, 213, 225, 0.65);
    --emboss-panel:
      0 5px 12px rgba(15, 23, 42, 0.07),
      inset 0 1px 0 rgba(255, 255, 255, 0.95);
    --emboss-input:
      inset 0 2px 5px rgba(15, 23, 42, 0.12),
      0 1px 0 rgba(255, 255, 255, 0.9);
    --emboss-btn:
      0 4px 0 #103c8c,
      0 6px 14px rgba(26, 115, 232, 0.28),
      inset 0 1px 0 rgba(255, 255, 255, 0.45);
    --emboss-sec:
      0 3px 0 #475569,
      0 5px 10px rgba(15, 23, 42, 0.12),
      inset 0 1px 0 rgba(255, 255, 255, 0.95);
  }

  *, *::before, *::after { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(180deg, #d7e2f0 0%, #e7eef7 55%, #dce5f2 100%);
    color: var(--ink);
    line-height: 1.62;
  }

  .container { width: 100%; max-width: 1080px; margin: 0 auto; padding: 0 18px; }

  /* Embossed Header */
  .site-header {
    background: linear-gradient(180deg, #ffffff 0%, #eef2f7 100%);
    border-bottom: 2px solid #94a3b8;
    box-shadow: 0 5px 14px rgba(15, 23, 42, 0.1), inset 0 1px 0 #ffffff;
    position: sticky;
    top: 0;
    z-index: 30;
  }
  .nav-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 10px;
    padding: 12px 0;
  }
  .brand {
    font-weight: 900;
    font-size: 1.24rem;
    color: var(--ink);
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    gap: 10px;
    letter-spacing: -0.02em;
  }
  .brand-dot {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: linear-gradient(180deg, #3b82f6 0%, #1d4ed8 100%);
    box-shadow: 0 0 0 3px #bfdbfe, inset 0 1px 1px #ffffff;
    display: inline-block;
  }
  .nav-right { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; }
  .nav-menu { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .nav-menu a {
    text-decoration: none;
    color: var(--ink);
    background: linear-gradient(180deg, #ffffff 0%, #e2e8f0 100%);
    border: 1.5px solid #64748b;
    border-bottom: 3px solid #475569;
    font-size: 0.83rem;
    font-weight: 800;
    padding: 6px 13px;
    border-radius: 9px;
    box-shadow: 0 2px 5px rgba(15, 23, 42, 0.08), inset 0 1px 0 #ffffff;
    transition: transform 0.1s ease, background 0.15s ease;
  }
  .nav-menu a:hover {
    color: var(--primary-dark);
    background: linear-gradient(180deg, #eff6ff 0%, #dbeafe 100%);
    border-color: var(--primary);
  }
  .nav-menu a:active { transform: translateY(1px); }
  .nav-menu a.active {
    color: #ffffff;
    background: linear-gradient(180deg, #3b82f6 0%, #1d4ed8 100%);
    border-color: #1e40af;
    border-bottom: 3px solid #172554;
    box-shadow: 0 3px 0 #172554, inset 0 1px 0 rgba(255, 255, 255, 0.4);
  }
  .lang-btn {
    background: linear-gradient(180deg, #334155 0%, #0f172a 100%);
    color: #ffffff;
    border: 1px solid #0f172a;
    border-bottom: 3px solid #000000;
    padding: 6px 14px;
    border-radius: 9px;
    font-weight: 800;
    font-size: 0.83rem;
    cursor: pointer;
    box-shadow: 0 3px 6px rgba(15, 23, 42, 0.2), inset 0 1px 0 rgba(255, 255, 255, 0.25);
  }
  .lang-btn:hover { background: linear-gradient(180deg, #2563eb 0%, #1d4ed8 100%); }
  .lang-btn:active { transform: translateY(1px); }

  /* Hero & Jump Strip */
  .page-head {
    background: linear-gradient(180deg, #ffffff 0%, #f1f5f9 100%);
    border-bottom: 2px solid #cbd5e1;
    box-shadow: inset 0 -2px 0 rgba(203, 213, 225, 0.6);
    padding: 24px 0 20px;
  }
  .page-head h1 {
    margin: 0 0 6px;
    font-size: clamp(1.5rem, 3.2vw, 2.05rem);
    font-weight: 900;
    letter-spacing: -0.02em;
  }
  .page-head p { margin: 0; color: var(--muted); font-size: 0.96rem; max-width: 820px; }

  .jump-strip {
    background: linear-gradient(180deg, #f8fafc 0%, #e2e8f0 100%);
    border-bottom: 2px solid #cbd5e1;
    padding: 11px 0;
  }
  .jump-inner { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .jump-label {
    font-size: 0.78rem;
    font-weight: 900;
    color: var(--ink);
    text-transform: uppercase;
    letter-spacing: 0.04em;
    margin-right: 4px;
  }
  .jump-pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 6px 14px;
    border-radius: 999px;
    background: linear-gradient(180deg, #ffffff 0%, #dbeafe 100%);
    border: 1.5px solid #60a5fa;
    border-bottom: 3px solid #2563eb;
    color: var(--primary-dark);
    text-decoration: none;
    font-size: 0.82rem;
    font-weight: 800;
    box-shadow: 0 2px 5px rgba(37, 99, 235, 0.14), inset 0 1px 0 #ffffff;
  }
  .jump-pill:hover {
    background: linear-gradient(180deg, #2563eb 0%, #1d4ed8 100%);
    color: #ffffff;
    border-color: #1e40af;
  }

  /* Page Stack */
  .page-flow { display: flex; flex-direction: column; gap: 26px; padding: 26px 0 34px; }

  /* Embossed Tool Card */
  .tool-card {
    background: linear-gradient(180deg, #ffffff 0%, #f8fafc 100%);
    border: 2px solid #60a5fa;
    border-top: 6px solid var(--primary);
    border-bottom: 4px solid #2563eb;
    border-radius: var(--radius);
    padding: 24px;
    box-shadow: var(--emboss-card);
    scroll-margin-top: 78px;
  }
  .card-head {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 12px;
    padding-bottom: 12px;
    border-bottom: 2px solid #e2e8f0;
  }
  .card-head h2 {
    margin: 0;
    font-size: 1.24rem;
    font-weight: 900;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .step-tag {
    background: linear-gradient(180deg, #3b82f6 0%, #1d4ed8 100%);
    color: #ffffff;
    font-size: 0.82rem;
    font-weight: 900;
    padding: 4px 11px;
    border-radius: 8px;
    box-shadow: 0 3px 0 #1e3a8a, inset 0 1px 0 rgba(255, 255, 255, 0.4);
  }
  .tool-status {
    font-size: 0.76rem;
    font-weight: 900;
    color: var(--primary-dark);
    background: linear-gradient(180deg, #eff6ff 0%, #bfdbfe 100%);
    border: 1.5px solid #60a5fa;
    padding: 4px 12px;
    border-radius: 999px;
    box-shadow: inset 0 1px 0 #ffffff;
  }
  .tool-intro { margin: 0 0 18px; color: var(--muted); font-size: 0.95rem; }

  .split-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(min(100%, 295px), 1fr));
    gap: 20px;
    align-items: start;
  }
  .panel {
    background: linear-gradient(180deg, #f8fafc 0%, #eef2f7 100%);
    border: 1.5px solid #94a3b8;
    border-bottom: 3px solid #64748b;
    border-radius: 13px;
    padding: 18px;
    box-shadow: var(--emboss-panel);
  }

  .field { margin-bottom: 13px; }
  .field:last-child { margin-bottom: 0; }
  .field label {
    display: block;
    font-size: 0.8rem;
    font-weight: 800;
    color: var(--muted);
    margin-bottom: 5px;
  }
  input[type="number"] {
    width: 100%;
    padding: 9px 12px;
    border: 2px solid #64748b;
    border-radius: 9px;
    font-size: 0.96rem;
    font-weight: 800;
    background: #ffffff;
    color: var(--ink);
    box-shadow: var(--emboss-input);
  }
  input[type="number"]:focus {
    outline: none;
    border-color: var(--primary);
    box-shadow: var(--emboss-input), 0 0 0 3px rgba(26, 115, 232, 0.22);
  }

  .presets { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 8px; }
  .preset-btn {
    background: linear-gradient(180deg, #ffffff 0%, #e2e8f0 100%);
    border: 1.5px solid #64748b;
    border-bottom: 3px solid #475569;
    color: var(--ink);
    padding: 4px 12px;
    border-radius: 999px;
    font-size: 0.8rem;
    font-weight: 800;
    cursor: pointer;
    box-shadow: 0 2px 4px rgba(15, 23, 42, 0.1), inset 0 1px 0 #ffffff;
  }
  .preset-btn:hover {
    background: linear-gradient(180deg, #eff6ff 0%, #bfdbfe 100%);
    border-color: var(--primary);
    color: var(--primary-dark);
  }
  .preset-btn:active { transform: translateY(1px); }

  .res-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    padding: 10px 13px;
    border: 1.5px solid #cbd5e1;
    border-bottom: 3px solid #94a3b8;
    border-radius: 10px;
    background: linear-gradient(180deg, #ffffff 0%, #f1f5f9 100%);
    margin-bottom: 9px;
    box-shadow: 0 2px 5px rgba(15, 23, 42, 0.05), inset 0 1px 0 #ffffff;
  }
  .res-row:last-of-type { margin-bottom: 0; }
  .res-row.highlight {
    background: linear-gradient(180deg, #eff6ff 0%, #bfdbfe 100%);
    border-color: #3b82f6;
    border-bottom: 3px solid #1d4ed8;
    font-weight: 900;
  }
  .res-label { font-size: 0.88rem; color: var(--muted); font-weight: 700; }
  .res-val { font-size: 0.96rem; font-weight: 900; color: var(--primary-dark); text-align: right; }

  .notice-box {
    margin-top: 12px;
    padding: 10px 13px;
    border-radius: 9px;
    background: var(--warn-bg);
    border: 1.5px solid var(--warn-border);
    color: var(--warn-ink);
    font-size: 0.86rem;
    font-weight: 700;
    display: none;
  }

  .toolbar { margin-top: 14px; display: flex; flex-wrap: wrap; gap: 10px; }
  .btn {
    background: linear-gradient(180deg, #3b82f6 0%, #1d4ed8 100%);
    color: #ffffff;
    border: 1px solid #1e40af;
    padding: 9px 17px;
    border-radius: 10px;
    font-weight: 800;
    font-size: 0.88rem;
    cursor: pointer;
    box-shadow: var(--emboss-btn);
  }
  .btn:hover { background: linear-gradient(180deg, #2563eb 0%, #1557b0 100%); }
  .btn:active { transform: translateY(2px); }

  .btn-sec {
    background: linear-gradient(180deg, #ffffff 0%, #cbd5e1 100%);
    color: var(--ink);
    border: 1.5px solid #64748b;
    padding: 8px 16px;
    border-radius: 10px;
    font-weight: 800;
    font-size: 0.86rem;
    cursor: pointer;
    box-shadow: var(--emboss-sec);
  }
  .btn-sec:hover { background: linear-gradient(180deg, #f8fafc 0%, #cbd5e1 100%); }
  .btn-sec:active { transform: translateY(2px); }

  /* Embossed Diagram Box */
  .diagram-box {
    margin-bottom: 18px;
    padding: 15px;
    background: linear-gradient(180deg, #ffffff 0%, #f1f5f9 100%);
    border: 2px solid #60a5fa;
    border-bottom: 4px solid #2563eb;
    border-radius: 13px;
    text-align: center;
    box-shadow: var(--emboss-panel);
  }
  .diagram-caption {
    font-size: 0.82rem;
    font-weight: 800;
    color: var(--primary-dark);
    margin-top: 7px;
  }

  /* Features & Use Grid */
  .tool-meta-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr));
    gap: 14px;
    margin-top: 20px;
    padding-top: 16px;
    border-top: 2px solid #e2e8f0;
  }
  .meta-box {
    background: linear-gradient(180deg, #ffffff 0%, #f1f5f9 100%);
    border: 1.5px solid #94a3b8;
    border-bottom: 3px solid #64748b;
    border-radius: 12px;
    padding: 14px 16px;
    box-shadow: 0 3px 8px rgba(15, 23, 42, 0.06), inset 0 1px 0 #ffffff;
  }
  .meta-box h3 { margin: 0 0 6px; font-size: 0.96rem; font-weight: 900; }
  .meta-box p, .meta-list { margin: 0; color: var(--muted); font-size: 0.9rem; }
  .meta-list { padding-left: 18px; }
  .meta-list li { margin-bottom: 4px; }

  /* Between-Tool Content & Ad Slots */
  .between-content {
    background: linear-gradient(180deg, #ffffff 0%, #f8fafc 100%);
    border: 1.5px solid #94a3b8;
    border-left: 6px solid var(--primary);
    border-bottom: 3px solid #64748b;
    border-radius: var(--radius);
    padding: 18px 20px;
    box-shadow: var(--emboss-card);
  }
  .between-content h3 { margin: 0 0 6px; font-size: 1.05rem; font-weight: 900; }
  .between-content p, .between-list { margin: 0 0 8px; color: var(--muted); font-size: 0.92rem; }
  .between-list { padding-left: 18px; }
  .between-list li { margin-bottom: 4px; }
  .example-strip {
    padding: 10px 14px;
    background: linear-gradient(180deg, #eff6ff 0%, #dbeafe 100%);
    border: 1.5px solid #60a5fa;
    border-bottom: 3px solid #2563eb;
    border-radius: 9px;
    font-size: 0.88rem;
    font-weight: 800;
    color: var(--primary-dark);
    box-shadow: inset 0 1px 0 #ffffff;
  }

  .ad-box {
    width: 100%;
    min-height: 96px;
    padding: 14px 16px;
    background: linear-gradient(180deg, #ffffff 0%, #e2e8f0 100%);
    border: 2px dashed #64748b;
    border-radius: var(--radius);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    gap: 5px;
    box-shadow: inset 0 2px 5px rgba(15, 23, 42, 0.08);
  }
  .ad-tag {
    font-size: 0.7rem;
    font-weight: 900;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink);
    background: #ffffff;
    border: 1.5px solid #94a3b8;
    padding: 2px 10px;
    border-radius: 999px;
  }
  .ad-placeholder-text { font-size: 0.84rem; color: var(--muted); font-weight: 700; }

  /* Embossed Footer */
  .site-footer {
    width: 100%;
    border-top: 2px solid #94a3b8;
    background: linear-gradient(180deg, #f8fafc 0%, #e2e8f0 100%);
    box-shadow: 0 -4px 12px rgba(15, 23, 42, 0.07), inset 0 1px 0 #ffffff;
    padding: 24px 0 34px;
    text-align: center;
    font-size: 0.88rem;
    color: var(--muted);
    margin-top: 10px;
  }
  .footer-links { margin-top: 10px; display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; }
  .footer-links a {
    color: var(--ink);
    text-decoration: none;
    font-weight: 800;
    background: #ffffff;
    border: 1px solid #94a3b8;
    border-bottom: 2px solid #64748b;
    padding: 4px 11px;
    border-radius: 8px;
  }
  .footer-links a:hover { color: var(--primary-dark); border-color: var(--primary); }
</style>
</head>
