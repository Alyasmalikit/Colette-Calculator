<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page 2</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #dce5f2;
    font-family: system-ui, sans-serif;
    color: #0f172a;
  }
  .wrap { max-width: 960px; margin: 16px auto; padding: 0 12px; display: flex; flex-direction: column; gap: 16px; }
  .box {
    background: linear-gradient(180deg, #ffffff 0%, #f1f5f9 100%);
    border: 2px solid #64748b;
    border-top: 5px solid #1a73e8;
    border-radius: 14px;
    padding: 12px;
    box-shadow: 0 8px 20px rgba(15,23,42,0.12), inset 0 2px 0 #ffffff;
  }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 680px) { .grid { grid-template-columns: 1fr; } }
  .cell-col {
    background: #eef2f7;
    border: 1.5px solid #94a3b8;
    border-radius: 10px;
    box-shadow: inset 0 1px 0 #ffffff, 0 3px 8px rgba(15,23,42,0.06);
    overflow: hidden;
  }
  input, button {
    font: inherit;
    border-radius: 0;
    border: 0;
  }
  input {
    display: block;
    width: 100%;
    padding: 0;
    background: #ffffff;
    border-bottom: 1px solid #cbd5e1;
    box-shadow: inset 0 2px 4px rgba(15,23,42,0.12);
    font-weight: 700;
  }
  .out {
    display: block;
    padding: 0;
    background: #ffffff;
    border-bottom: 1px solid #cbd5e1;
    font-weight: 800;
    color: #103c8c;
  }
  .btn {
    padding: 4px 10px;
    margin: 6px 4px 0 0;
    border-radius: 7px;
    background: linear-gradient(180deg, #ffffff 0%, #cbd5e1 100%);
    border: 1.5px solid #64748b;
    border-bottom: 3px solid #475569;
    font-weight: 800;
    cursor: pointer;
    box-shadow: 0 2px 5px rgba(15,23,42,0.12), inset 0 1px 0 #ffffff;
  }
  .btn:active { transform: translateY(1px); }
  .top-bar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .top-bar a {
    text-decoration: none;
    color: #0f172a;
    font-weight: 800;
    padding: 5px 10px;
    border-radius: 8px;
    background: linear-gradient(180deg, #ffffff 0%, #cbd5e1 100%);
    border: 1.5px solid #64748b;
    border-bottom: 3px solid #475569;
  }
</style>
</head>
<body>

<div class="wrap">
  <div class="top-bar">
    <a href="index.html">index.html</a>
    <a href="page2.html">page2.html</a>
    <button type="button" class="btn" id="langBtn">EN</button>
  </div>

  <!-- TOOL 1 -->
  <div class="box">
    <div class="grid">
      <div class="cell-col">
        <input type="number" id="rate" step="0.01" value="16.50">
        <input type="number" id="reg" step="0.01" value="35">
        <input type="number" id="ot" step="0.01" value="4.5">
        <input type="number" id="pct" step="1" value="25">
        <button type="button" class="btn" data-ot="10">+10%</button>
        <button type="button" class="btn" data-ot="25">+25%</button>
        <button type="button" class="btn" data-ot="50">+50%</button>
        <button type="button" class="btn" id="rst1">0</button>
      </div>
      <div class="cell-col">
        <span class="out" id="oTotH"></span>
        <span class="out" id="oBase"></span>
        <span class="out" id="oOt"></span>
        <span class="out" id="oTotal"></span>
      </div>
    </div>
  </div>

  <!-- TOOL 2 -->
  <div class="box">
    <div class="grid">
      <div class="cell-col">
        <input type="number" id="pan" step="0.01" value="4.2">
        <input type="number" id="cr" step="0.01" value="3.2">
        <input type="number" id="eg" step="0.01" value="11.4">
        <input type="number" id="h" step="0.01" value="2.8">
        <button type="button" class="btn" id="rst2">0</button>
      </div>
      <div class="cell-col">
        <span class="out" id="oFait"></span>
        <span class="out" id="oCp"></span>
        <span class="out" id="oCc"></span>
        <span class="out" id="oAr"></span>
        <span class="out" id="oSurf"></span>
      </div>
    </div>
  </div>
</div>

<script>
(function () {
  let lang = "fr";
  function c1() {
    const r = Math.max(0, parseFloat(rate.value) || 0);
    const g = Math.max(0, parseFloat(reg.value) || 0);
    const o = Math.max(0, parseFloat(ot.value) || 0);
    const p = Math.max(0, parseFloat(pct.value) || 0);
    const b = g * r;
    const op = o * r * (1 + p / 100);
    oTotH.textContent = (g + o).toFixed(2);
    oBase.textContent = b.toFixed(2);
    oOt.textContent = op.toFixed(2);
    oTotal.textContent = (b + op).toFixed(2);
  }
  function c2() {
    const a = Math.max(0, parseFloat(pan.value) || 0);
    const c = Math.max(0, parseFloat(cr.value) || 0);
    const e = Math.max(0, parseFloat(eg.value) || 0);
    const x = Math.max(0, parseFloat(h.value) || 0);
    const f = Math.max(0, e - 2 * c);
    const cp = Math.hypot(a, x);
    const cc = Math.hypot(c, x);
    const ar = Math.hypot(Math.hypot(a, c), x);
    const s = 2 * (((f + e) / 2) * cp) + 2 * (0.5 * a * cc);
    oFait.textContent = f.toFixed(2);
    oCp.textContent = cp.toFixed(2);
    oCc.textContent = cc.toFixed(2);
    oAr.textContent = ar.toFixed(2);
    oSurf.textContent = s.toFixed(2);
  }
  langBtn.onclick = function () { lang = lang === "fr" ? "en" : "fr"; langBtn.textContent = lang === "fr" ? "EN" : "FR"; };
  [rate, reg, ot, pct].forEach(el => el.oninput = c1);
  document.querySelectorAll("[data-ot]").forEach(b => b.onclick = () => { pct.value = b.dataset.ot; c1(); });
  rst1.onclick = () => { [rate, reg, ot, pct].forEach(el => el.value = "0"); c1(); };
  [pan, cr, eg, h].forEach(el => el.oninput = c2);
  rst2.onclick = () => { [pan, cr, eg, h].forEach(el => el.value = "0"); c2(); };
  c1(); c2();
})();
</script>
</body>
</html>
