<html lang="fr">
<head>

<title>Colette-Calculator | Home — Temps, Pauses &amp; Centièmes (1/100e)</title>
<style>
  :root {
    --bg: #e2e8f0;
    --surface: #ffffff;
    --ink: #0f172a;
    --muted: #334155;
    --border: #64748b;
    --border-soft: #cbd5e1;
    --primary: #1a73e8;
    --primary-hover: #1557b0;
    --primary-dark: #103c8c;
    --soft: #dbeafe;
    --warn-bg: #fef9c3;
    --warn-border: #eab308;
    --warn-ink: #713f12;
    --radius: 16px;
    --emboss-card: 0 10px 24px rgba(15, 23, 42, 0.12), inset 0 1px 0 rgba(255, 255, 255, 0.95);
    --emboss-btn: 0 3px 0 #103c8c, 0 5px 10px rgba(26, 115, 232, 0.25);
    --emboss-sec: 0 3px 0 #64748b, 0 4px 8px rgba(15, 23, 42, 0.08);
  }
  *, *::before, *::after { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(180deg, #dce5f2 0%, #e8eef6 100%);
    color: var(--ink);
    line-height: 1.6;
  }
  .container { width: 100%; max-width: 1100px; margin: 0 auto; padding: 0 18px; }

  .site-header {
    background: linear-gradient(180deg, #ffffff 0%, #f1f5f9 100%);
    border-bottom: 2px solid #94a3b8;
    box-shadow: 0 4px 12px rgba(15, 23, 42, 0.08);
    position: sticky;
    top: 0;
    z-index: 30;
  }
  .nav-bar { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; padding: 12px 0; }
  .brand {
    font-weight: 900; font-size: 1.24rem; color: var(--ink); text-decoration: none;
    display: inline-flex; align-items: center; gap: 10px; letter-spacing: -0.02em;
  }
  .brand-dot {
    width: 12px; height: 12px; border-radius: 50%; background: var(--primary);
    box-shadow: 0 0 0 3px #bfdbfe; display: inline-block;
  }
  .nav-right { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; }
  .nav-menu { display: flex; flex-wrap: wrap; gap: 8px; }
  .nav-menu a {
    display: inline-flex; align-items: center; justify-content: center;
    color: var(--ink); background: linear-gradient(180deg, #ffffff 0%, #f1f5f9 100%);
    border: 1.5px solid #64748b; border-bottom: 3px solid #475569;
    text-decoration: none; font-size: 0.82rem; font-weight: 800; padding: 6px 12px; border-radius: 9px; white-space: nowrap;
  }
  .nav-menu a:hover { color: var(--primary-dark); background: #eff6ff; border-color: var(--primary); }
  .nav-menu a.active {
    color: #fff; background: linear-gradient(180deg, #2563eb 0%, #1d4ed8 100%);
    border-color: #1e40af; border-bottom: 3px solid #172554;
  }
  .lang-btn {
    background: linear-gradient(180deg, #1e293b 0%, #0f172a 100%);
    color: #fff; border: 1px solid #0f172a; border-bottom: 3px solid #000;
    padding: 6px 13px; border-radius: 9px; font-weight: 800; font-size: 0.82rem; cursor: pointer;
  }
  .lang-btn:hover { background: var(--primary); border-color: var(--primary-dark); }

  .page-head {
    background: linear-gradient(180deg, #ffffff 0%, #f8fafc 100%);
    border-bottom: 2px solid #cbd5e1;
    padding: 24px 0 20px;
  }
  .page-head h1 { margin: 0 0 6px; font-size: clamp(1.5rem, 3.2vw, 2.1rem); font-weight: 900; letter-spacing: -0.02em; }
  .page-head p { margin: 0; color: var(--muted); font-size: 0.96rem; font-weight: 500; max-width: 820px; }

  .jump-strip { background: #f8fafc; border-bottom: 2px solid #cbd5e1; padding: 11px 0; }
  .jump-inner { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .jump-label { font-size: 0.78rem; font-weight: 900; color: var(--ink); text-transform: uppercase; letter-spacing: 0.04em; margin-right: 4px; }
  .jump-pill {
    display: inline-flex; align-items: center; gap: 6px; padding: 6px 13px; border-radius: 999px;
    background: linear-gradient(180deg, #eff6ff 0%, #dbeafe 100%);
    border: 1.5px solid #60a5fa; border-bottom: 3px solid #2563eb;
    color: var(--primary-dark); text-decoration: none; font-size: 0.82rem; font-weight: 800;
  }
  .jump-pill:hover { background: var(--primary); color: #fff; border-color: var(--primary-dark); }

  .page-flow { display: flex; flex-direction: column; gap: 26px; padding: 26px 0 32px; }
  .tool-card {
    background: linear-gradient(180deg, #ffffff 0%, #f8fafc 100%);
    border: 2px solid #3b82f6;
    border-top: 6px solid var(--primary);
    border-bottom: 4px solid #2563eb;
    border-radius: var(--radius);
    padding: 24px;
    box-shadow: var(--emboss-card);
    width: 100%;
    scroll-margin-top: 78px;
  }
  .card-head {
    display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between;
    gap: 10px; margin-bottom: 12px; padding-bottom: 12px; border-bottom: 2px solid #e2e8f0;
  }
  .card-head h2 { margin: 0; font-size: 1.22rem; font-weight: 900; display: flex; align-items: center; gap: 10px; }
  .step-tag {
    background: linear-gradient(180deg, #2563eb 0%, #1d4ed8 100%);
    color: #fff; font-size: 0.82rem; font-weight: 900; padding: 4px 11px; border-radius: 8px;
    box-shadow: 0 2px 0 #1e3a8a;
  }
  .tool-status {
    font-size: 0.76rem; font-weight: 900; color: var(--primary-dark);
    background: #dbeafe; border: 1.5px solid #60a5fa; padding: 4px 11px; border-radius: 999px;
  }
  .tool-intro { margin: 0 0 18px; color: var(--muted); font-size: 0.95rem; font-weight: 500; }

  .tool-meta-grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr));
    gap: 14px; margin-top: 20px; padding-top: 16px; border-top: 2px solid #e2e8f0;
  }
  .meta-box {
    background: #ffffff; border: 1.5px solid #cbd5e1; border-bottom: 3px solid #94a3b8;
    border-radius: 12px; padding: 14px 16px;
  }
  .meta-box h3 { margin: 0 0 6px; font-size: 0.96rem; font-weight: 800; color: var(--ink); }
  .meta-box p, .meta-list { margin: 0; color: var(--muted); font-size: 0.9rem; }
  .meta-list { padding-left: 18px; }
  .meta-list li { margin-bottom: 5px; }

  .between-content {
    background: #ffffff; border: 1.5px solid #94a3b8; border-left: 6px solid var(--primary);
    border-bottom: 3px solid #64748b; border-radius: var(--radius); padding: 18px 20px;
    box-shadow: var(--emboss-card);
  }
  .between-content h3 { margin: 0 0 6px; font-size: 1.04rem; font-weight: 800; }
  .between-content p, .between-list { margin: 0 0 8px; color: var(--muted); font-size: 0.92rem; }
  .between-list { padding-left: 18px; }
  .between-list li { margin-bottom: 4px; }
  .example-strip {
    padding: 10px 13px; background: #eff6ff; border: 1.5px solid #93c5fd;
    border-radius: 9px; font-size: 0.88rem; font-weight: 800; color: var(--primary-dark);
  }

  .ad-box {
    width: 100%; min-height: 96px; padding: 14px 16px;
    background: linear-gradient(180deg, #ffffff 0%, #f1f5f9 100%);
    border: 2px dashed #64748b; border-radius: var(--radius);
    display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 5px;
  }
  .ad-tag { font-size: 0.7rem; font-weight: 900; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink); background: #e2e8f0; border: 1px solid #94a3b8; padding: 2px 9px; border-radius: 999px; }
  .ad-placeholder-text { font-size: 0.84rem; color: var(--muted); font-weight: 700; }

  .slot-row {
    display: grid; grid-template-columns: 30px minmax(0, 1.2fr) minmax(0, 1.2fr) minmax(0, 1.15fr) minmax(0, 0.9fr) 38px;
    gap: 14px; align-items: center; padding: 14px 16px;
    border: 1.5px solid #94a3b8; border-bottom: 3px solid #64748b;
    border-radius: 12px; margin-bottom: 12px; background: #ffffff;
  }
  .slot-row.disabled { opacity: 0.52; }
  .slot-check { width: 19px; height: 19px; cursor: pointer; justify-self: center; margin-top: 16px; }
  @media (max-width: 760px) { .slot-row { grid-template-columns: 32px repeat(2, minmax(0, 1fr)) 38px; gap: 12px; } .slot-check, .del-btn { margin-top: 0; } }
  .slot-field label { display: block; font-size: 0.77rem; font-weight: 800; color: var(--muted); margin-bottom: 6px; }
  input[type="time"], input[type="number"] {
    width: 100%; min-width: 0; padding: 9px 11px;
    border: 2px solid #64748b; border-radius: 9px;
    font-size: 0.98rem; font-weight: 800; background: #ffffff; color: var(--ink);
    box-shadow: inset 0 2px 4px rgba(15, 23, 42, 0.08);
  }
  input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(26, 115, 232, 0.22); }
  .out-pill {
    padding: 9px 12px;
    background: linear-gradient(180deg, #eff6ff 0%, #dbeafe 100%);
    border: 2px solid #3b82f6; border-bottom: 3px solid #1d4ed8;
    border-radius: 9px; font-weight: 900; font-size: 0.95rem;
    color: var(--primary-dark); text-align: center; white-space: nowrap;
  }
  .overnight-tag { display: inline-block; margin-left: 5px; padding: 1px 6px; border-radius: 999px; background: var(--primary); color: #fff; font-size: 0.7rem; font-weight: 800; }
  .del-btn { background: #fee2e2; color: #991b1b; border: 1.5px solid #f87171; border-bottom: 3px solid #dc2626; width: 34px; height: 34px; border-radius: 8px; font-weight: 900; cursor: pointer; margin-top: 16px; }
  .del-btn:disabled { opacity: 0.35; cursor: not-allowed; }

  .toolbar { display: flex; flex-wrap: wrap; gap: 12px; margin: 16px 0; }
  .btn {
    background: linear-gradient(180deg, #2563eb 0%, #1d4ed8 100%);
    color: #fff; border: 1px solid #1e40af; padding: 10px 18px; border-radius: 10px;
    font-weight: 800; font-size: 0.9rem; cursor: pointer; box-shadow: var(--emboss-btn);
  }
  .btn:hover { background: var(--primary-hover); }
  .btn:active { transform: translateY(2px); }
  .btn-sec {
    background: linear-gradient(180deg, #ffffff 0%, #e2e8f0 100%);
    color: var(--ink); border: 1.5px solid #64748b; padding: 9px 16px; border-radius: 10px;
    font-weight: 800; font-size: 0.88rem; cursor: pointer; box-shadow: var(--emboss-sec);
  }
  .btn-sec:hover { background: #e2e8f0; }
  .btn-sec:active { transform: translateY(2px); }

  .total-bar {
    display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 14px;
    padding: 16px 18px; background: linear-gradient(180deg, #eff6ff 0%, #dbeafe 100%);
    border: 2px solid #3b82f6; border-bottom: 4px solid #1d4ed8; border-radius: 13px;
  }
  .total-label { font-size: 1rem; font-weight: 900; color: var(--ink); }
  .total-vals { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
  .total-badge {
    background: #fff; border: 2px solid #2563eb; border-bottom: 3px solid #1e3a8a;
    padding: 6px 14px; border-radius: 9px; font-weight: 900; font-size: 1.08rem; color: var(--primary-dark);
  }
  .notice-box { margin-top: 12px; padding: 10px 14px; border-radius: 9px; background: var(--warn-bg); border: 1.5px solid var(--warn-border); color: var(--warn-ink); font-size: 0.88rem; font-weight: 700; display: none; }

  .sub-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 240px), 1fr)); gap: 18px; align-items: end; }
