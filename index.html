<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page 1</title>
  <style>
    :root {
      --bg: #f1f5f9;
      --surface: #ffffff;
      --ink: #0f172a;
      --border: #94a3b8;
      --accent: #1d4ed8;
      --ad-bg: #fffbeb;
      --ad-border: #d97706;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: var(--bg);
      color: var(--ink);
      font-size: 18px;
    }

    .wrap {
      max-width: 1140px;
      margin: 0 auto;
      padding: 20px 18px 110px;
    }

    .topbar {
      background: var(--surface);
      border: 2px solid var(--border);
      border-radius: 14px;
      padding: 16px 20px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 26px;
    }

    .nav-group {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .nav-link {
      text-decoration: none;
      font-size: 17px;
      font-weight: 800;
      padding: 10px 18px;
      border-radius: 10px;
      border: 2px solid var(--accent);
      color: var(--accent);
      background: #fff;
    }

    .nav-link.active,
    .nav-link:hover {
      background: var(--accent);
      color: #fff;
    }

    .ad-space {
      background: var(--ad-bg);
      border: 2px dashed var(--ad-border);
      border-radius: 12px;
      min-height: 140px;
      margin: 32px 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .ad-tag {
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #92400e;
      background: #fef3c7;
      padding: 4px 12px;
      border-radius: 999px;
      margin-bottom: 8px;
    }

    .ad-title {
      font-size: 16px;
      font-weight: 700;
      color: #78350f;
    }

    .empty-slot {
      background: var(--surface);
      border: 2px solid var(--border);
      border-radius: 14px;
      min-height: 420px;
      margin: 32px 0;
      padding: 24px;
    }

    .pager {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-top: 36px;
      flex-wrap: wrap;
    }

    .pager a {
      text-decoration: none;
      background: var(--accent);
      color: #fff;
      font-size: 18px;
      font-weight: 800;
      padding: 14px 22px;
      border-radius: 12px;
    }

    .sticky-ad {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      background: #fef3c7;
      border-top: 2px solid var(--ad-border);
      padding: 12px 16px;
      text-align: center;
      font-size: 15px;
      font-weight: 800;
      color: #78350f;
      z-index: 999;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="topbar">
      <nav class="nav-group" aria-label="Pages">
        <a class="nav-link active" href="index.html">Page 1</a>
        <a class="nav-link" href="page-2.html">Page 2</a>
        <a class="nav-link" href="page-3.html">Page 3</a>
      </nav>
    </header>

    <!-- AD SPACE 1 -->
    <div class="ad-space" data-ad="p1-ad-1">
      <span class="ad-tag">Advertisement</span>
      <div class="ad-title">Ad Space 1</div>
    </div>

    <!-- AD SPACE 2 -->
    <div class="ad-space" data-ad="p1-ad-2">
      <span class="ad-tag">Advertisement</span>
      <div class="ad-title">Ad Space 2</div>
    </div>

    <!-- EMPTY CONTENT / TOOLS ZONE 1 -->
    <main class="empty-slot" id="page1-slot-1"></main>

    <!-- AD SPACE 3 -->
    <div class="ad-space" data-ad="p1-ad-3">
      <span class="ad-tag">Advertisement</span>
      <div class="ad-title">Ad Space 3</div>
    </div>

    <!-- EMPTY CONTENT / TOOLS ZONE 2 -->
    <section class="empty-slot" id="page1-slot-2"></section>

    <!-- AD SPACE 4 -->
    <div class="ad-space" data-ad="p1-ad-4">
      <span class="ad-tag">Advertisement</span>
      <div class="ad-title">Ad Space 4</div>
    </div>

    <!-- EMPTY CONTENT / TOOLS ZONE 3 -->
    <section class="empty-slot" id="page1-slot-3"></section>

    <!-- AD SPACE 5 -->
    <div class="ad-space" data-ad="p1-ad-5">
      <span class="ad-tag">Advertisement</span>
      <div class="ad-title">Ad Space 5</div>
    </div>

    <!-- EMPTY CONTENT / TOOLS ZONE 4 -->
    <section class="empty-slot" id="page1-slot-4"></section>

    <!-- AD SPACE 6 -->
    <div class="ad-space" data-ad="p1-ad-6">
      <span class="ad-tag">Advertisement</span>
      <div class="ad-title">Ad Space 6</div>
    </div>

    <div class="pager">
      <span></span>
      <a href="page-2.html">Page 2 →</a>
    </div>
  </div>

  <div class="sticky-ad" data-ad="p1-sticky">
    Advertisement — Sticky Ad Space 7
  </div>
</body>
</html>
