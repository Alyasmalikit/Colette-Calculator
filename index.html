<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Colette-Calculator | Page 1 — Temps, Pauses &amp; Centièmes (1/100e)</title>
<meta name="description" content="Colette-Calculator Page 1: Additionnez vos plages horaires, soustrayez vos pauses et convertissez vos heures-minutes en centièmes d'heure (1/100e).">
<style>
  :root {
    --bg: #eef2f7;
    --surface: #ffffff;
    --ink: #0f172a;
    --muted: #475569;
    --border: #94a3b8;
    --border-soft: #cbd5e1;
    --primary: #1a73e8;
    --primary-hover: #1557b0;
    --primary-dark: #174ea6;
    --soft: #eff6ff;
    --warn-bg: #fefce8;
    --warn-border: #fde047;
    --warn-ink: #854d0e;
    --radius: 14px;
    --shadow: 0 4px 14px rgba(15, 23, 42, 0.06);
  }
  *, *::before, *::after { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    max-width: 100%;
    overflow-x: hidden;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--ink);
    line-height: 1.6;
  }
  .container {
    width: 100%;
    max-width: 1080px;
    margin: 0 auto;
    padding: 0 18px;
  }

  /* Header */
  .site-header {
    width: 100%;
    background: var(--surface);
    border-bottom: 1px solid var(--border-soft);
    position: sticky;
    top: 0;
    z-index: 30;
  }
  .nav-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 10px;
    padding: 12px 0;
  }
  .brand {
    font-weight: 800;
    font-size: 1.18rem;
    color: var(--ink);
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    gap: 9px;
    flex-shrink: 0;
  }
  .brand-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--primary);
    display: inline-block;
  }
  .nav-right {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px;
    min-width: 0;
    max-width: 100%;
  }
  .site-header .nav-menu {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    min-width: 0;
  }
  .site-header .nav-menu a {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    color: var(--ink);
    background: #ffffff;
    border: 1px solid var(--border);
    border-bottom: 2px solid #64748b;
    text-decoration: none;
    font-size: 0.8rem;
    font-weight: 700;
    padding: 5px 10px;
    border-radius: 7px;
    white-space: nowrap;
    box-shadow: 0 1px 2px rgba(15, 23, 42, 0.08);
    transition: background 0.12s ease, border-color 0.12s ease, color 0.12s ease, transform 0.1s ease;
  }
  .site-header .nav-menu a:hover {
    color: var(--primary);
    background: var(--soft);
    border-color: var(--primary);
    border-bottom-color: var(--primary-dark);
    transform: translateY(-1px);
  }
  .site-header .nav-menu a:active { transform: translateY(1px); }
  .site-header .nav-menu a.active {
    color: #ffffff;
    background: var(--primary);
    border-color: var(--primary);
    border-bottom-color: var(--primary-dark);
  }
  .lang-btn {
    background: var(--ink);
    color: #fff;
    border: none;
    padding: 7px 13px;
    border-radius: 8px;
    font-weight: 700;
    font-size: 0.8rem;
    cursor: pointer;
    flex-shrink: 0;
  }
  .lang-btn:hover { background: var(--primary); }

  /* Page Title Section */
  .page-head {
    background: var(--surface);
    border-bottom: 1px solid var(--border-soft);
    padding: 24px 0 20px;
  }
  .page-head h1 {
    margin: 0 0 6px;
    font-size: clamp(1.5rem, 3.2vw, 2.05rem);
    letter-spacing: -0.02em;
    color: var(--ink);
  }
  .page-head p {
    margin: 0;
    color: var(--muted);
    font-size: 0.95rem;
    max-width: 780px;
  }

  /* Quick Jump Strip */
  .jump-strip {
    background: var(--surface);
    border-bottom: 1px solid var(--border-soft);
    padding: 10px 0;
    position: sticky;
    top: 57px;
    z-index: 20;
  }
  .jump-inner {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
  }
  .jump-label {
    font-size: 0.76rem;
    font-weight: 800;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.04em;
    margin-right: 4px;
  }
  .jump-pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 6px 12px;
    border-radius: 999px;
    background: var(--soft);
    border: 1px solid #93c5fd;
    color: var(--primary-dark);
    text-decoration: none;
    font-size: 0.8rem;
    font-weight: 800;
  }
  .jump-pill:hover {
    background: var(--primary);
    color: #ffffff;
    border-color: var(--primary);
  }

  /* Stacked Page Flow */
  .page-flow {
    display: flex;
    flex-direction: column;
    gap: 24px;
    padding: 24px 0 28px;
  }

  /* High-Visibility Tool Cards */
  .tool-card {
    background: var(--surface);
    border: 2px solid #60a5fa;
    border-top: 5px solid var(--primary);
    border-radius: var(--radius);
    padding: 24px;
    box-shadow: var(--shadow);
    width: 100%;
    min-width: 0;
    scroll-margin-top: 112px;
  }
  .card-head {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 10px;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--border-soft);
  }
  .card-head h2 {
    margin: 0;
    font-size: 1.18rem;
    color: var(--ink);
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .step-tag {
    background: var(--primary);
    color: #ffffff;
    font-size: 0.8rem;
    font-weight: 800;
    padding: 3px 10px;
    border-radius: 7px;
  }
  .tool-status {
    font-size: 0.74rem;
    font-weight: 800;
    color: var(--primary-dark);
    background: var(--soft);
    border: 1px solid #93c5fd;
    padding: 3px 10px;
    border-radius: 999px;
  }
  .tool-intro {
    margin: 0 0 18px;
    color: var(--muted);
    font-size: 0.93rem;
  }

  /* Tool Meta */
  .tool-meta-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr));
    gap: 14px;
    margin-top: 20px;
    padding-top: 16px;
    border-top: 1px solid var(--border-soft);
  }
  .meta-box {
    background: #f8fafc;
    border: 1px solid var(--border-soft);
    border-radius: 12px;
    padding: 14px 16px;
  }
  .meta-box h3 {
    margin: 0 0 6px;
    font-size: 0.94rem;
    color: var(--ink);
  }
  .meta-box p {
    margin: 0;
    color: var(--muted);
    font-size: 0.89rem;
  }
  .meta-list {
    margin: 0;
    padding-left: 18px;
    color: var(--muted);
    font-size: 0.89rem;
  }
  .meta-list li { margin-bottom: 5px; }
  .meta-list li:last-child { margin-bottom: 0; }

  /* Between-Tool Content */
  .between-content {
    background: var(--surface);
    border: 1px solid var(--border-soft);
    border-left: 4px solid var(--primary);
    border-radius: var(--radius);
    padding: 18px 20px;
    box-shadow: var(--shadow);
  }
  .between-content h3 {
    margin: 0 0 6px;
    font-size: 1rem;
    color: var(--ink);
  }
  .between-content p {
    margin: 0 0 8px;
    color: var(--muted);
    font-size: 0.9rem;
  }
  .between-list {
    margin: 6px 0 10px;
    padding-left: 18px;
    color: var(--muted);
    font-size: 0.89rem;
  }
  .between-list li { margin-bottom: 4px; }
  .example-strip {
    padding: 9px 12px;
    background: #f8fafc;
    border: 1px solid var(--border-soft);
    border-radius: 8px;
    font-size: 0.86rem;
    font-weight: 700;
    color: var(--ink);
  }

  /* Visible Ad Space */
  .ad-box {
    width: 100%;
    min-height: 92px;
    padding: 12px 16px;
    background: var(--surface);
    border: 2px dashed var(--border);
    border-radius: var(--radius);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    gap: 4px;
  }
  .ad-tag {
    font-size: 0.68rem;
    font-weight: 800;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
    background: #f1f5f9;
    border: 1px solid var(--border-soft);
    padding: 2px 8px;
    border-radius: 999px;
  }
  .ad-placeholder-text {
    font-size: 0.82rem;
    color: var(--muted);
    font-weight: 600;
  }

  /* Tool 1 Cells */
  .slot-row {
    display: grid;
    grid-template-columns: 30px minmax(0, 1.2fr) minmax(0, 1.2fr) minmax(0, 1.15fr) minmax(0, 0.9fr) 38px;
    gap: 14px;
    align-items: center;
    padding: 14px 16px;
    border: 1px solid var(--border-soft);
    border-radius: 12px;
    margin-bottom: 12px;
    background: #f8fafc;
  }
  .slot-row:hover {
    border-color: #60a5fa;
    background: #ffffff;
  }
  .slot-row.disabled { opacity: 0.5; }
  .slot-check {
    width: 18px;
    height: 18px;
    cursor: pointer;
    justify-self: center;
    margin-top: 16px;
  }
  @media (max-width: 760px) {
    .slot-row {
      grid-template-columns: 32px repeat(2, minmax(0, 1fr)) 38px;
      gap: 12px;
    }
    .slot-check, .del-btn { margin-top: 0; }
  }
  .slot-field label {
    display: block;
    font-size: 0.75rem;
    font-weight: 700;
    color: var(--muted);
    margin-bottom: 6px;
  }
  input[type="time"], input[type="number"] {
    width: 100%;
    min-width: 0;
    padding: 9px 11px;
    border: 1.5px solid var(--border);
    border-radius: 8px;
    font-size: 0.95rem;
    font-weight: 700;
    background: #fff;
    color: var(--ink);
  }
  input:focus {
    outline: none;
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(26, 115, 232, 0.16);
  }
  .out-pill {
    padding: 9px 12px;
    background: #dbeafe;
    border: 1.5px solid #60a5fa;
    border-radius: 8px;
    font-weight: 900;
    font-size: 0.92rem;
    color: var(--primary-dark);
    text-align: center;
    white-space: nowrap;
  }
  .overnight-tag {
    display: inline-block;
    margin-left: 5px;
    padding: 1px 6px;
    border-radius: 999px;
    background: var(--primary);
    color: #ffffff;
    font-size: 0.7rem;
    font-weight: 800;
    vertical-align: middle;
  }
  .del-btn {
    background: #fee2e2;
    color: #b91c1c;
    border: none;
    width: 34px;
    height: 34px;
    border-radius: 8px;
    font-weight: 700;
    cursor: pointer;
    margin-top: 16px;
  }
  .del-btn:hover:not(:disabled) { background: #fecaca; }
  .del-btn:disabled { opacity: 0.35; cursor: not-allowed; }

  .toolbar {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    margin: 16px 0;
  }
  .btn {
    background: var(--primary);
    color: #fff;
    border: none;
    padding: 9px 16px;
    border-radius: 9px;
    font-weight: 700;
    font-size: 0.88rem;
    cursor: pointer;
  }
  .btn:hover { background: var(--primary-hover); }
  .btn-sec {
    background: #f1f5f9;
    color: var(--ink);
    border: 1px solid var(--border);
    padding: 9px 15px;
    border-radius: 9px;
    font-weight: 600;
    font-size: 0.88rem;
    cursor: pointer;
  }
  .btn-sec:hover { background: #e2e8f0; }

  .total-bar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
    padding: 16px 18px;
    background: var(--soft);
    border: 1.5px solid #60a5fa;
    border-radius: 12px;
  }
  .total-label {
    font-size: 0.96rem;
    font-weight: 900;
    letter-spacing: 0.02em;
    color: var(--ink);
  }
  .total-vals {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    align-items: center;
  }
  .total-badge {
    background: #fff;
    border: 1.5px solid #60a5fa;
    padding: 6px 14px;
    border-radius: 8px;
    font-weight: 900;
    font-size: 1.04rem;
    color: var(--primary-dark);
  }
  .notice-box {
    margin-top: 12px;
    padding: 10px 14px;
    border-radius: 9px;
    background: var(--warn-bg);
    border: 1px solid var(--warn-border);
    color: var(--warn-ink);
    font-size: 0.86rem;
    font-weight: 600;
    display: none;
  }

  /* Tool 2 & Tool 3 Grids */
  .sub-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(min(100%, 240px), 1fr));
    gap: 18px;
    align-items: end;
  }
  .hm-pair {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .hm-pair span {
    font-size: 0.84rem;
    font-weight: 700;
    color: var(--muted);
  }

  .conv-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr));
    gap: 20px;
  }
  .conv-box {
    background: #f8fafc;
    border: 1px solid var(--border-soft);
    border-radius: 12px;
    padding: 18px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .conv-box h3 {
    margin: 0;
    font-size: 1rem;
    color: var(--ink);
  }

  /* Page Switcher Footer Bar */
  .page-nav-box {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    background: var(--surface);
    border: 1.5px solid var(--border-soft);
    border-radius: var(--radius);
    padding: 16px 20px;
    box-shadow: var(--shadow);
  }

  /* Footer */
  .
